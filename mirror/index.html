<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mayday Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /*
   * Phone mirror: runs the real Mayday web build inside a frame that is
   * exactly an iPhone's screen in points, like iPhone Mirroring on a Mac.
   * The app inside is the same code that ships to phones; this file only
   * draws the hardware around it (frame, Dynamic Island, status bar, home
   * indicator) and turns the app's haptic events into a visible buzz.
   */
  :root {
    --desk: #0d0d0c;
    --desk-ink: #a8a39a;
    --desk-faint: #6f6b64;
    --frame-a: #3a3936;
    --frame-b: #1c1b19;
    --bezel: #050505;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--desk); overflow: hidden; }
  body {
    font-family: Geist, system-ui, sans-serif;
    color: var(--desk-ink);
    display: grid;
    place-items: center;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: relative; transform-origin: center center; }

  /* Titanium band, then the black bezel, then the screen. */
  .phone {
    position: relative;
    padding: 4px;
    border-radius: calc(var(--r) + 16px);
    background: linear-gradient(145deg, var(--frame-a), var(--frame-b) 45%, #2b2a27 80%, var(--frame-a));
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06) inset,
      0 40px 80px rgba(0,0,0,0.55),
      0 12px 24px rgba(0,0,0,0.4);
  }
  .bezel {
    padding: 12px;
    border-radius: calc(var(--r) + 12px);
    background: var(--bezel);
  }
  .screen {
    position: relative;
    width: var(--w);
    height: var(--h);
    border-radius: var(--r);
    overflow: hidden;
    background: #121110;
    isolation: isolate;
  }
  iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: block;
    background: #121110;
  }

  /* Hardware drawn over the app, never intercepting touches. */
  .island {
    position: absolute; z-index: 3; pointer-events: none;
    top: 11px; left: 50%; transform: translateX(-50%);
    width: 125px; height: 37px; border-radius: 19px; background: #000;
  }
  .status {
    position: absolute; z-index: 2; pointer-events: none;
    top: 0; left: 0; right: 0; height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 30px 0 46px;
    color: #f2efe8; font-weight: 600; font-size: 17px; letter-spacing: -0.2px;
    font-variant-numeric: tabular-nums;
  }
  .status.dark-ink { color: #121110; }
  .status .right { display: flex; gap: 7px; align-items: center; }
  .home {
    position: absolute; z-index: 2; pointer-events: none;
    bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 139px; height: 5px; border-radius: 3px; background: rgba(242,239,232,0.85);
  }

  /* Side buttons. */
  .btn { position: absolute; background: linear-gradient(90deg, #2b2a27, #45433f); border-radius: 2px; }
  .btn.left { left: -3px; width: 4px; }
  .btn.right { right: -3px; width: 4px; }

  /* Haptics made visible: the phone twitches the way it would buzz in your hand. */
  @keyframes tick { 0%{transform:translate(0,0)} 30%{transform:translate(-1.2px,0)} 60%{transform:translate(1.2px,0)} 100%{transform:translate(0,0)} }
  @keyframes thud { 0%{transform:translate(0,0)} 20%{transform:translate(-3px,1px)} 45%{transform:translate(3px,-1px)} 70%{transform:translate(-1.5px,0)} 100%{transform:translate(0,0)} }
  .buzz-tick { animation: tick 90ms linear; }
  .buzz-thud { animation: thud 220ms ease-out; }

  .caption {
    position: absolute; left: 0; right: 0; top: calc(100% + 18px);
    display: flex; justify-content: center; gap: 14px; align-items: center;
    font-size: 13px; color: var(--desk-faint); white-space: nowrap;
  }
  .caption b { color: var(--desk-ink); font-weight: 500; }
  .caption select, .caption button {
    font: inherit; color: var(--desk-ink); background: #1b1a18; border: 1px solid rgba(242,239,232,0.12);
    border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  .caption button:hover, .caption select:hover { border-color: rgba(242,239,232,0.25); }
  .caption button:focus-visible, .caption select:focus-visible { outline: 2px solid #d2be94; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .buzz-tick, .buzz-thud { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <div class="phone" id="phone">
    <span class="btn left" style="top:150px;height:32px"></span>
    <span class="btn left" style="top:215px;height:62px"></span>
    <span class="btn left" style="top:290px;height:62px"></span>
    <span class="btn right" style="top:240px;height:96px"></span>
    <div class="bezel">
      <div class="screen" id="screen">
        <iframe id="app" title="Mayday" allow="microphone; geolocation; camera; autoplay"></iframe>
        <div class="status" id="status">
          <span id="clock">9:41</span>
          <span class="right" aria-hidden="true">
            <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3.2" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3.2" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3.2" height="12" rx="1" fill="currentColor"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.4l1.2-1.2C13.9 1.6 11.3.5 8.5.5S3.1 1.6 1.1 3.5l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3Zm0 3.6c1.4 0 2.7.5 3.7 1.4l1.2-1.2C12.1 4.9 10.4 4.1 8.5 4.1S4.9 4.9 3.6 6.1l1.2 1.2c1-.9 2.3-1.4 3.7-1.4Zm0 3.6c.5 0 .9.2 1.2.5L8.5 11.2 7.3 10c.3-.3.7-.5 1.2-.5Z" fill="currentColor"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" stroke="currentColor" stroke-opacity="0.4" fill="none"/><rect x="2" y="2" width="17" height="9" rx="2.5" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" fill-opacity="0.45"/></svg>
          </span>
        </div>
        <div class="island"></div>
        <div class="home"></div>
      </div>
    </div>
  </div>
  <div class="caption">
    <select id="device" aria-label="Device"></select>
    <span id="spec"></span>
    <button id="scaleBtn" type="button"></button>
    <button id="reload" type="button" aria-label="Reload app">Reload</button>
  </div>
</div>
<script>
  // Screen sizes in points (what the app lays out in) and physical pixels.
  // iPhone 17 family figures are Apple's published resolutions divided by 3.
  const DEVICES = {
    'iphone-17-pro':     { name: 'iPhone 17 Pro',     w: 402, h: 874, scale: 3, r: 62, top: 62, bottom: 34 },
    'iphone-17-pro-max': { name: 'iPhone 17 Pro Max', w: 440, h: 956, scale: 3, r: 66, top: 62, bottom: 34 },
    'iphone-air':        { name: 'iPhone Air',        w: 420, h: 912, scale: 3, r: 64, top: 62, bottom: 34 },
  };
  const params = new URLSearchParams(location.search);
  const appUrl = params.get('src') || '/';
  let deviceId = localStorageGet('mirror.device') || 'iphone-17-pro';
  let mode = localStorageGet('mirror.scale') || 'fit';

  function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

  const stage = document.getElementById('stage');
  const screen = document.getElementById('screen');
  const iframe = document.getElementById('app');
  const select = document.getElementById('device');
  const spec = document.getElementById('spec');
  const scaleBtn = document.getElementById('scaleBtn');

  for (const [id, d] of Object.entries(DEVICES)) {
    const o = document.createElement('option');
    o.value = id; o.textContent = d.name;
    select.appendChild(o);
  }

  function load() {
    const d = DEVICES[deviceId];
    select.value = deviceId;
    screen.style.setProperty('--w', d.w + 'px');
    screen.style.setProperty('--h', d.h + 'px');
    document.getElementById('phone').style.setProperty('--r', d.r + 'px');
    screen.style.setProperty('--r', d.r + 'px');
    spec.innerHTML = `<b>${d.w} × ${d.h}</b> pt · ${d.w * d.scale} × ${d.h * d.scale} px`;
    const sep = appUrl.includes('?') ? '&' : '?';
    iframe.src = `${appUrl}${sep}insets=${d.top},0,${d.bottom},0`;
    fit();
  }

  function fit() {
    const rect = { w: stage.offsetWidth, h: stage.offsetHeight + 56 };
    const s = Math.min(1, (innerWidth - 32) / rect.w, (innerHeight - 24) / rect.h);
    const scale = mode === '1:1' ? 1 : s;
    stage.style.transform = `scale(${scale})`;
    const real = s >= 0.999;
    scaleBtn.textContent = mode === '1:1' ? 'Fit window' : real ? '1:1' : `${Math.round(scale * 100)}%`;
    scaleBtn.title = mode === '1:1' ? 'Shrink to fit the window' : 'Show one screen pixel per point';
  }

  select.addEventListener('change', () => { deviceId = select.value; localStorageSet('mirror.device', deviceId); load(); });
  scaleBtn.addEventListener('click', () => { mode = mode === '1:1' ? 'fit' : '1:1'; localStorageSet('mirror.scale', mode); fit(); });
  document.getElementById('reload').addEventListener('click', () => load());
  addEventListener('resize', fit);

  // Live clock in the status bar.
  function tickClock() {
    const now = new Date();
    document.getElementById('clock').textContent = `${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, '0')}`;
  }
  tickClock(); setInterval(tickClock, 5000);

  // The app tells us when it would vibrate.
  const phone = document.getElementById('phone');
  addEventListener('message', (e) => {
    const m = e.data;
    if (!m || m.type !== 'mayday:haptic') return;
    const heavy = ['start', 'swap', 'attention', 'countdown'].includes(m.event);
    phone.classList.remove('buzz-tick', 'buzz-thud');
    void phone.offsetWidth; // restart the animation
    phone.classList.add(heavy ? 'buzz-thud' : 'buzz-tick');
  });

  load();
</script>
</body>
</html>
